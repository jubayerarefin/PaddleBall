<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DX Ball</title>
  <link rel="stylesheet" href="dx-ball.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" width="700" height="500"></canvas>
    <div id="ui-overlay">
      <div id="start-screen" class="screen active">
        <h1>DX BALL</h1>
        <p>Press SPACE to start</p>
      </div>
      <div id="game-over-screen" class="screen">
        <h1>GAME OVER</h1>
        <p>Press SPACE to restart</p>
      </div>
      <div id="level-complete-screen" class="screen">
        <h1 id="level-complete-text">LEVEL COMPLETE</h1>
        <p>Press SPACE to continue</p>
      </div>
      <div id="victory-screen" class="screen">
        <h1>VICTORY!</h1>
        <p>Press SPACE to restart</p>
      </div>
      <div id="hud">
        <div id="hud-left">Score: <span id="score">0</span></div>
        <div id="hud-center">Level: <span id="level">1</span></div>
        <div id="hud-right">Lives: <span id="lives">3</span></div>
      </div>
    </div>
  </div>
  <script src="bricks.js"></script>
  <script src="ball.js"></script>
  <script src="paddle.js"></script>
  <script src="powerups.js"></script>
  <script src="particles.js"></script>
  <script src="sound.js"></script>
  <script src="dx-ball.js"></script>
</body>
</html>
